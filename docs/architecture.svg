<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img">
  <title>Private Alibaba Cloud ACK architecture</title>
  <desc>OpenTofu or CI writes a private OSS state bucket locked by TableStore. Resource groups sit beside a three-zone VPC. The ACK API is private. Each zone has a subscription system pool, a Spot application pool and Terway pod vSwitches. Egress uses a NAT Gateway and an EIP. SLS, KMS and private Argo CD are separate. There is no public Kubernetes API.</desc>
  <metadata>
    <creator>Vigiles Pte. Ltd.</creator>
    <website>https://vigileshq.com/</website>
    <repository>https://github.com/Vigiles-HQ/alibaba-cloud-ack-opentofu</repository>
    <created>2026-09-23</created>
    <diagramDescription>Private ACK Pro cluster with multi-zone node pools, Terway, NAT egress, OSS state and a TableStore lock.</diagramDescription>
  </metadata>
